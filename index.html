<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principia Academy | Física e Matemática</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="navbar">
        <div class="logo">P<span>Principia Academy</span></div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#cursos">Cursos</a></li>
                <li><a href="#metodologia">Metodologia</a></li>
                <li><a href="#contato" class="btn-cta">INSCREVA-SE</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Domine a Física e a Matemática.</h1>
            <p>Com o método certo, qualquer aluno pode aprender ciências exatas.</p>
            <div class="hero-btns">
                <a href="#contato" class="btn-primary">INSCREVA-SE</a>
                <a href="#cursos" class="btn-secondary">Ver Cursos</a>
            </div>
        </div>
        <div class="hero-floating-cards">
            <div class="card">F = m · a</div>
            <div class="card">E = mc²</div>
        </div>
    </section>

    <section id="cursos" class="courses">
        <h2>Escolha o curso ideal para você</h2>
        <div class="grid-courses">
            <div class="course-card">
                <h3>Reforço Escolar</h3>
                <p>Ensino Fundamental e Médio.</p>
                <button>Saiba Mais</button>
            </div>
            </div>
    </section>

    <script>lucide.createIcons();</script>

</html>
